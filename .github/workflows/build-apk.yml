# ---------------------------------------------------------------------------
# 云端打安卓 APK（GitHub Actions）—— 直接在 runner 上用 pip 装 buildozer
#
# 为什么不再用 kivy/buildozer 那个 Docker 镜像：
#   镜像内的基础 python 环境出过一连串底层故障（pip 模块混装导致
#   open_rich_spinner / RequirementInformation 报错，之后又出现
#   `/usr/local/bin/python: No module named venv`）。改成在 runner 上自己
#   装一套受控环境，可复现性更好。
#
# 关键点（每条都对应一次真实踩过的坑）：
#   1. 必须用 actions/setup-python 显式指定 3.11 —— 不能用 runner 默认的
#      python（太新，p4a 交叉编译会炸）。
#   2. apt 依赖照抄 p4a 官方 Dockerfile，但**去掉 libtinfo5**
#      （ubuntu 24.04 已无此包，照抄老文档会 apt 报错），并保留
#      python3-venv（否则 p4a 建 venv 时报 "No module named venv"）。
#   3. **不要** pip install python-for-android —— buildozer 是自己去 git
#      clone p4a 的（buildozer/targets/android.py: p4a.url + p4a.branch），
#      pip 上那个包根本不会被用到。要锁 p4a 版本请改 buildozer.spec 的
#      p4a.branch（buildozer 会 `git fetch --tags` + `git checkout`，tag 可用）。
#   4. PIP_CONSTRAINT 钉住 pip，避免 p4a 内部 `pip install -U pip` 装出
#      "模块混装"的 pip。
#
# 用法：
#   推到 GitHub 后在 Actions 页面点 "Build Android APK" -> Run workflow，
#   跑完在页面底部 Artifacts 里下载 apk 压缩包。
# ---------------------------------------------------------------------------
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "iqplay_android.py"
      - "iqdsp.py"
      - "buildozer.spec"
      - "ci_build_apk.sh"
      - "prepare_p4a.sh"
      - "patch_p4a_pip.py"
      - ".github/workflows/**"
  workflow_dispatch:            # 也支持手动点按钮触发

# 连续 push 会逐个触发构建，而一次构建要 20~40 分钟 —— 不限制的话会排队跑好几个
# 早已过时的版本。这里让"同一个分支只保留最新一次构建"，新的 push 会取消旧的。
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    env:
      # 把 p4a 自建 build/venv 里的 pip 钉死（预防模块混装）
      PIP_PIN: "25.2"
      # buildozer 的构建目录（干净暂存目录，见"准备干净构建目录"步骤）
      APP_DIR: "_apk_stage"

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      # ⚠️ 关键：显式用 Python 3.11。runner 默认 python 版本较新，
      # 与 p4a/NDK 25b 的交叉编译不兼容。
      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 依赖清单来自 p4a 官方 Dockerfile（pythonforandroid/Dockerfile）。
      # 已按 ubuntu-24.04 校对：
      #   - 删掉 libtinfo5（noble 里不存在，写了会 apt 失败）
      #   - 保留 python3-venv（对应 "No module named venv"）
      - name: 安装系统依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool libssl-dev \
            make openjdk-17-jdk patch pkg-config \
            python3-dev python3-pip python3-venv \
            unzip wget zip ca-certificates
          echo "== 版本自检 =="
          python3 --version
          java -version 2>&1 | head -2

      - name: 指定 JDK 17
        run: |
          if [ -d /usr/lib/jvm/java-17-openjdk-amd64 ]; then
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
            echo "已设置 JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
          else
            echo "警告：没找到 java-17-openjdk-amd64，交给 buildozer 自动探测"
            ls -d /usr/lib/jvm/* || true
          fi

      - name: 安装 buildozer
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          # 只装 buildozer；p4a 由 buildozer 自己 git clone（见文件头说明 3）
          python -m pip install "cython<3" "buildozer==1.6.0"
          echo "== 自检 =="
          python -c "import buildozer, sys; print('buildozer ok, python', sys.version)"
          buildozer --version

      # buildozer 会把 source.dir **整个**打包，而本仓库里还有别的文件。
      # 先把该进包的东西拷进一个干净目录，避免混入无关文件。
      - name: 准备干净构建目录
        run: |
          set -e
          mkdir -p _apk_stage
          for f in main.py iqplay_android.py iqdsp.py buildozer.spec; do
            if [ ! -f "$f" ]; then echo "缺少源文件: $f"; exit 1; fi
            cp "$f" _apk_stage/
          done
          # 有中文字体兜底就一起带上
          for f in font.ttf 字体.ttf icon.png presplash.png; do
            [ -f "$f" ] && cp "$f" _apk_stage/ || true
          done
          echo "== 暂存目录 =="
          ls -la _apk_stage

      # 整个 _apk_stage/.buildozer 都清掉：里面有 p4a 的 git 克隆、各 recipe 的
      # 构建产物，以及那个**可能已经被弄坏的 build/venv**。跨版本复用很容易出
      # 诡异错误（我们已经中过一次"陈旧环境"）。
      # 注意：不能删 ~/.buildozer —— 那里是 Android SDK/NDK（3~5 GB），删掉每次
      # 构建都要重下，白白多花十几分钟。SDK/NDK 与 python 版本无关，可安全复用；
      # 只顺手清掉它里面残留的 build venv。
      - name: 清空项目构建目录（保留 SDK/NDK）
        run: |
          rm -rf _apk_stage/.buildozer || true
          find "$HOME/.buildozer" -type d -name venv -prune -print -exec rm -rf {} + 2>/dev/null || true
          echo "已清空 _apk_stage/.buildozer（SDK/NDK 保留）"

      # 只缓存 SDK/NDK（~/.buildozer），不再缓存整个构建目录。
      # key 抬到 v3：构建方式从 Docker 换成 runner 直装，旧缓存不再适用。
      - name: 复用 SDK/NDK 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: sdk-ndk-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            sdk-ndk-v3-${{ runner.os }}-

      - name: 构建 APK
        run: bash ci_build_apk.sh

      # ⚠️ 只收 buildozer 的最终产物（bin/ 下那一个），**不要**用 find 全盘搜。
      # 实测：一次构建会在三个地方各留一份 apk ——
      #   1) .../build-*/dists/iqplay/build/outputs/apk/debug/iqplay-debug.apk
      #      （gradle 的原始输出）
      #   2) .../platform/python-for-android/iqplay-debug-<版本>.apk
      #      （p4a 的 _finish_package 把上一步 cp 到它的工作目录，见
      #        pythonforandroid/toolchain.py:1140-1146 package_add_version 分支）
      #   3) bin/<包名>-<版本>-<架构>-debug.apk   ← buildozer 复制出的最终产物
      # 三份二进制完全相同，但一起塞进 artifact 会让人不知道该装哪个。
      - name: 收集产物
        run: |
          set -e
          ls -lh _apk_stage/bin/*.apk
          mkdir -p apk-out
          cp _apk_stage/bin/*.apk apk-out/
          # 顺手把构建日志也带上，方便排查真机问题
          for lg in _apk_stage/.buildozer/android/platform/build-*/build.log; do
            [ -f "$lg" ] && cp "$lg" apk-out/ || true
          done
          # 记下文件名与短哈希，让不同次构建的产物一眼能区分
          apk=$(basename "$(ls _apk_stage/bin/*.apk | head -1)")
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "== 本次产物 =="
          ls -la apk-out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iqplay-apk-${{ env.SHORT_SHA }}
          path: apk-out/
          if-no-files-found: error
          retention-days: 30
