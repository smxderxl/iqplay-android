# ---------------------------------------------------------------------------
# 云端打安卓 APK（GitHub Actions）
#
# 为什么走云：buildozer 只能跑在 Linux 上，本机是 Windows 且 WSL 被策略拦住。
# 这里用 kivy 官方维护的 buildozer 镜像——里面已经预装 Android SDK/NDK，
# 比从零下载（3~5 GB）快很多。
#
# 用法：
#   1) 把仓库推到 GitHub
#   2) 到 Actions 页面点 "Build Android APK" -> Run workflow（或直接 push 触发）
#   3) 跑完在页面底部 Artifacts 里下载 apk 压缩包
# ---------------------------------------------------------------------------
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "iqplay_android.py"
      - "iqdsp.py"
      - "buildozer.spec"
      - ".github/workflows/**"
  workflow_dispatch:            # 也支持手动点按钮触发

jobs:
  build-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      # buildozer 会把 source.dir **整个**打包，而本仓库里还有别的文件。
      # 先把该进包的东西拷进一个干净目录，避免混入无关文件。
      - name: 准备干净构建目录
        run: |
          set -e
          mkdir -p _apk_stage
          for f in main.py iqplay_android.py iqdsp.py buildozer.spec; do
            if [ ! -f "$f" ]; then echo "缺少源文件: $f"; exit 1; fi
            cp "$f" _apk_stage/
          done
          # 有中文字体兜底就一起带上
          for f in font.ttf 字体.ttf icon.png presplash.png; do
            [ -f "$f" ] && cp "$f" _apk_stage/ || true
          done
          echo "== 暂存目录 =="
          ls -la _apk_stage

      # 整个 _apk_stage/.buildozer 都清掉：里面有 p4a 的 git 克隆和
      # 各 recipe 的构建产物，跨版本复用很容易出诡异错误。
      # 注意：不能删 ~/.buildozer —— 那里是 Android SDK/NDK（3~5 GB），
      # 删掉每次构建都要重下，白白多花十几分钟。SDK/NDK 与 python 版本无关，
      # 跨版本可以安全复用。
      - name: 清空项目构建目录（保留 SDK/NDK）
        run: |
          rm -rf _apk_stage/.buildozer || true
          echo "已清空 _apk_stage/.buildozer"

      # 只缓存 SDK/NDK（~/.buildozer），不再缓存整个构建目录。
      - name: 复用 SDK/NDK 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: sdk-ndk-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            sdk-ndk-v1-${{ runner.os }}-

      - name: 构建 APK
        run: |
          set -e
          cd _apk_stage
          # 用 kivy 官方镜像：已内置 Android SDK / NDK / buildozer 依赖。
          #
          # 这里没有直接用默认的 entrypoint，而是先 bash 里把 pip 升到 >=25.2，
          # 再 exec 官方 entrypoint.sh。原因：
          #   构建曾报 "cannot import name 'open_rich_spinner' from
          #   'pip._internal.cli.spinners'" —— 该 API 是 pip 25.2 才新增的，
          #   镜像 venv 里自带的 pip 比这旧。无论到底是谁 import 它，
          #   把 pip 升上去都能满足。
          #   必须 exec 回官方 entrypoint.sh：它负责把容器用户映射成宿主机
          #   UID/GID（否则挂载目录里产生的文件是 root 的，后续步骤会权限报错）。
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "pip install -q --upgrade 'pip>=25.2' && exec /usr/local/bin/entrypoint.sh android debug"

      - name: 收集产物
        run: |
          set -e
          echo "== 找到的 APK =="
          find _apk_stage -name "*.apk" -type f -exec ls -lh {} \;
          mkdir -p apk-out
          find _apk_stage -name "*.apk" -type f -exec cp {} apk-out/ \;
          # 顺手把构建日志也带上，方便排查真机问题
          [ -f _apk_stage/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build.log ] \
            && cp _apk_stage/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build.log apk-out/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: iqplay-apk
          path: apk-out/
          if-no-files-found: error
          retention-days: 30
